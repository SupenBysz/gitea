name: Release Build

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      version_override:
        description: '覆盖版本号（可选，格式：v1.25.2.11251-Kysion）'
        required: false
        type: string

# 并发控制：同一分支上只允许一个工作流运行
# 当新的提交触发工作流时，会自动取消正在运行的旧工作流
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Job 1: 生成版本号
  generate-version:
    name: Generate Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 生成版本号
        id: version
        env:
          GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}
        run: |
          if [ -n "${{ inputs.version_override }}" ]; then
            # 使用手动指定的版本号
            VERSION="${{ inputs.version_override }}"
          else
            # 从 VERSION 文件读取基础版本
            BASE_VERSION=$(cat VERSION | tr -d '\n')
            # 生成日期（MMDD格式，如 1125 表示 11月25日）
            DATE=$(date +%m%d)

            # 查询当天已有的 release 数量，计算递增序号
            # 获取所有 releases 并筛选当天的版本
            GITEA_URL="${GITHUB_SERVER_URL}"
            REPO="${GITHUB_REPOSITORY}"

            # 查询已有的 releases
            RELEASES=$(curl -s -H "Authorization: token ${GITEA_TOKEN}" \
              "${GITEA_URL}/api/v1/repos/${REPO}/releases?limit=100" 2>/dev/null || echo "[]")

            # 统计当天已有的发布数量（匹配 .MMDD序号- 格式）
            TODAY_COUNT=$(echo "$RELEASES" | grep -o "\"tag_name\":\"v[^\"]*\.${DATE}[0-9]*-Kysion\"" | wc -l | tr -d ' ')

            # 序号 = 当天发布数量 + 1
            SEQ=$((TODAY_COUNT + 1))

            echo "📊 当天已有 ${TODAY_COUNT} 个发布，本次序号: ${SEQ}"

            # 组合完整版本号：v{BASE_VERSION}.{MMDD}{序号}-Kysion（日期和序号之间无点）
            VERSION="v${BASE_VERSION}.${DATE}${SEQ}-Kysion"
          fi

          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "✅ 生成版本号: ${VERSION}"

      - name: 显示版本信息
        run: |
          echo "📦 准备构建版本: ${{ steps.version.outputs.version }}"

  # Job 2: 构建前端（只构建一次）
  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Node.js 环境
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 安装 pnpm
        run: npm install -g pnpm

      - name: 显示环境信息
        run: |
          echo "📦 Node版本: $(node --version)"
          echo "📦 pnpm版本: $(pnpm --version)"

      - name: 安装前端依赖
        run: |
          echo "📦 安装前端依赖..."
          pnpm install --frozen-lockfile

      - name: 编译前端
        run: |
          echo "🔨 编译前端资源..."
          NODE_ENV=production BROWSERSLIST_IGNORE_OLD_DATA=true pnpm exec webpack --disable-interpret

      - name: 设置 Go 环境（用于生成 bindata）
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: 生成 bindata 文件
        env:
          TAGS: "bindata sqlite sqlite_unlock_notify"
        run: |
          echo "📦 生成 bindata 文件..."
          # 运行 go generate 将前端资源嵌入 Go 代码
          go generate -tags "${TAGS}" ./...
          echo "✅ bindata 生成完成"
          # 验证 bindata 文件已生成
          ls -la modules/public/bindata.* 2>/dev/null || echo "public bindata files not found"
          ls -la modules/options/bindata.* 2>/dev/null || echo "options bindata files not found"
          ls -la modules/templates/bindata.* 2>/dev/null || echo "templates bindata files not found"

      - name: 上传前端构建产物（包含 bindata）
        uses: actions/upload-artifact@v3
        with:
          name: frontend-build
          path: |
            public/assets/
            modules/public/bindata.*
            modules/options/bindata.*
            modules/templates/bindata.*
          retention-days: 1

  # Job 3: 构建后端（多平台 matrix）
  build-backend:
    name: Build Backend (${{ matrix.os }}-${{ matrix.arch }})
    needs: [generate-version, build-frontend]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - os: darwin
            arch: arm64
          - os: darwin
            arch: amd64
          - os: linux
            arch: arm64
          - os: linux
            arch: amd64

    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 设置 Go 环境
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: 显示环境信息
        run: |
          echo "🔨 Go版本: $(go version)"
          echo "🎯 目标平台: ${{ matrix.os }}-${{ matrix.arch }}"
          echo "📦 版本号: ${{ needs.generate-version.outputs.version }}"

      - name: 下载前端构建产物（包含 bindata）
        uses: actions/download-artifact@v3
        with:
          name: frontend-build
          path: .

      - name: 验证 bindata 文件
        run: |
          echo "🔍 验证 bindata 文件..."
          ls -la public/assets/ | head -10
          ls -la modules/public/bindata.* 2>/dev/null || echo "⚠️ public bindata 未找到"
          ls -la modules/options/bindata.* 2>/dev/null || echo "⚠️ options bindata 未找到"
          ls -la modules/templates/bindata.* 2>/dev/null || echo "⚠️ templates bindata 未找到"

      - name: 编译后端 (${{ matrix.os }}-${{ matrix.arch }})
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: 0
          VERSION: ${{ needs.generate-version.outputs.version }}
          TAGS: "bindata sqlite sqlite_unlock_notify"
        run: |
          echo "🔨 编译后端 (${{ matrix.os }}-${{ matrix.arch }})..."
          echo "📦 使用 TAGS: ${TAGS}"
          go build \
            -tags "${TAGS}" \
            -ldflags "-s -w -X 'main.Version=${VERSION}' -X 'main.Tags=${TAGS}'" \
            -o gitea-${{ matrix.os }}-${{ matrix.arch }} \
            code.gitea.io/gitea

          echo "✅ 编译完成"
          ls -lh gitea-${{ matrix.os }}-${{ matrix.arch }}

      - name: 验证构建产物
        run: |
          echo "🔍 验证构建产物..."

          BINARY="gitea-${{ matrix.os }}-${{ matrix.arch }}"

          # 检查文件是否存在
          if [ ! -f "${BINARY}" ]; then
            echo "❌ 二进制文件不存在: ${BINARY}"
            exit 1
          fi

          # 检查文件大小（应该大于 80MB，包含 bindata 资源）
          SIZE=$(stat -c%s "${BINARY}" 2>/dev/null || stat -f%z "${BINARY}")
          MIN_SIZE=$((80 * 1024 * 1024))

          if [ "${SIZE}" -lt "${MIN_SIZE}" ]; then
            echo "❌ 二进制文件过小: ${SIZE} bytes (预期 > 80MB)"
            echo "⚠️ 可能原因: bindata 未正确嵌入，请检查 go generate 步骤"
            exit 1
          fi

          echo "✅ 构建产物验证通过"
          echo "   文件: ${BINARY}"
          echo "   大小: $(numfmt --to=iec ${SIZE} 2>/dev/null || echo "${SIZE} bytes")"
          echo "   版本: ${{ needs.generate-version.outputs.version }}"

      - name: 创建发布包
        run: |
          echo "📦 创建发布包..."

          VERSION="${{ needs.generate-version.outputs.version }}"
          PLATFORM="${{ matrix.os }}-${{ matrix.arch }}"
          PACKAGE_NAME="gitea-${VERSION}-${PLATFORM}"
          PACKAGE_DIR="${PACKAGE_NAME}"

          # 创建打包目录
          mkdir -p "${PACKAGE_DIR}"

          # 复制二进制文件
          cp gitea-${{ matrix.os }}-${{ matrix.arch }} "${PACKAGE_DIR}/gitea"
          chmod +x "${PACKAGE_DIR}/gitea"

          # 复制资源文件
          if [ -d "custom" ]; then
            cp -r custom "${PACKAGE_DIR}/"
          fi

          if [ -d "templates" ]; then
            cp -r templates "${PACKAGE_DIR}/"
          fi

          if [ -d "public" ]; then
            cp -r public "${PACKAGE_DIR}/"
          fi

          if [ -d "options" ]; then
            cp -r options "${PACKAGE_DIR}/"
          fi

          # 复制文档
          if [ -f "LICENSE" ]; then
            cp LICENSE "${PACKAGE_DIR}/"
          fi

          if [ -f "README.md" ]; then
            cp README.md "${PACKAGE_DIR}/"
          fi

          # 创建启动脚本（使用 echo 避免 heredoc YAML 解析问题）
          echo '#!/bin/bash' > "${PACKAGE_DIR}/start.sh"
          echo '# Gitea 启动脚本' >> "${PACKAGE_DIR}/start.sh"
          echo '' >> "${PACKAGE_DIR}/start.sh"
          echo 'set -e' >> "${PACKAGE_DIR}/start.sh"
          echo '' >> "${PACKAGE_DIR}/start.sh"
          echo 'if [ -z "$GITEA_WORK_DIR" ]; then' >> "${PACKAGE_DIR}/start.sh"
          echo '  GITEA_WORK_DIR="$(pwd)"' >> "${PACKAGE_DIR}/start.sh"
          echo 'fi' >> "${PACKAGE_DIR}/start.sh"
          echo 'if [ -z "$GITEA_CUSTOM" ]; then' >> "${PACKAGE_DIR}/start.sh"
          echo '  GITEA_CUSTOM="${GITEA_WORK_DIR}/custom"' >> "${PACKAGE_DIR}/start.sh"
          echo 'fi' >> "${PACKAGE_DIR}/start.sh"
          echo '' >> "${PACKAGE_DIR}/start.sh"
          echo 'export GITEA_WORK_DIR' >> "${PACKAGE_DIR}/start.sh"
          echo 'export GITEA_CUSTOM' >> "${PACKAGE_DIR}/start.sh"
          echo '' >> "${PACKAGE_DIR}/start.sh"
          echo 'echo "Starting Gitea..."' >> "${PACKAGE_DIR}/start.sh"
          echo 'echo "Work directory: ${GITEA_WORK_DIR}"' >> "${PACKAGE_DIR}/start.sh"
          echo 'echo "Custom directory: ${GITEA_CUSTOM}"' >> "${PACKAGE_DIR}/start.sh"
          echo '' >> "${PACKAGE_DIR}/start.sh"
          echo 'exec ./gitea web' >> "${PACKAGE_DIR}/start.sh"

          chmod +x "${PACKAGE_DIR}/start.sh"

          # 创建 tar.gz 压缩包
          tar czf "${PACKAGE_NAME}.tar.gz" "${PACKAGE_DIR}"

          # 生成 SHA256 校验文件
          sha256sum "${PACKAGE_NAME}.tar.gz" > "${PACKAGE_NAME}.tar.gz.sha256"

          echo "✅ 发布包创建完成"
          ls -lh "${PACKAGE_NAME}.tar.gz"
          cat "${PACKAGE_NAME}.tar.gz.sha256"

      - name: 上传构建产物
        uses: actions/upload-artifact@v3
        with:
          name: gitea-${{ needs.generate-version.outputs.version }}-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            gitea-${{ needs.generate-version.outputs.version }}-${{ matrix.os }}-${{ matrix.arch }}.tar.gz
            gitea-${{ needs.generate-version.outputs.version }}-${{ matrix.os }}-${{ matrix.arch }}.tar.gz.sha256
          retention-days: 30

  # Job 4: 构建摘要
  build-summary:
    name: Build Summary
    needs: [generate-version, build-backend]
    runs-on: ubuntu-latest
    steps:
      - name: 构建摘要
        run: |
          echo "## 🎉 多平台构建完成" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**版本号**: \`${{ needs.generate-version.outputs.version }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**支持平台**:" >> $GITHUB_STEP_SUMMARY
          echo "- 🍎 macOS ARM64 (darwin-arm64)" >> $GITHUB_STEP_SUMMARY
          echo "- 🍎 macOS x86_64 (darwin-amd64)" >> $GITHUB_STEP_SUMMARY
          echo "- 🐧 Linux ARM64 (linux-arm64)" >> $GITHUB_STEP_SUMMARY
          echo "- 🐧 Linux x86_64 (linux-amd64)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**产物列表**:" >> $GITHUB_STEP_SUMMARY
          echo "- \`gitea-${{ needs.generate-version.outputs.version }}-darwin-arm64.tar.gz\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`gitea-${{ needs.generate-version.outputs.version }}-darwin-amd64.tar.gz\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`gitea-${{ needs.generate-version.outputs.version }}-linux-arm64.tar.gz\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`gitea-${{ needs.generate-version.outputs.version }}-linux-amd64.tar.gz\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "💡 所有产物包含 SHA256 校验文件" >> $GITHUB_STEP_SUMMARY

  # Job 5: 创建 Release
  create-release:
    name: Create Release
    needs: [generate-version, build-backend]
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 下载所有构建产物
        uses: actions/download-artifact@v3
        with:
          path: artifacts/

      - name: 整理产物文件
        run: |
          echo "📦 整理产物文件..."
          mkdir -p release-files

          # 将所有产物移动到 release-files 目录
          find artifacts/ -name "*.tar.gz" -exec mv {} release-files/ \;
          find artifacts/ -name "*.sha256" -exec mv {} release-files/ \;

          echo "✅ 产物文件列表:"
          ls -lh release-files/

      - name: 生成 Release Notes
        id: release-notes
        run: |
          VERSION="${{ needs.generate-version.outputs.version }}"

          # 读取 SHA256 校验和
          cd release-files

          cat > ../release-notes.md << EOF
          ## 🎉 Kysion Gitea ${VERSION}

          基于 Gitea v1.25.2 的定制版本，包含 Kysion 特定优化和功能。

          ### 📦 支持平台

          - 🍎 **macOS ARM64** (darwin-arm64) - Apple Silicon (M1/M2/M3)
          - 🍎 **macOS x86_64** (darwin-amd64) - Intel Mac
          - 🐧 **Linux ARM64** (linux-arm64) - ARM64 服务器
          - 🐧 **Linux x86_64** (linux-amd64) - x86_64 服务器

          ### 📥 下载说明

          请根据您的平台选择相应的压缩包下载。每个压缩包包含：
          - \`gitea\` - 可执行文件
          - \`start.sh\` - 启动脚本
          - \`custom/\` - 自定义配置
          - \`templates/\` - 模板文件
          - \`public/\` - 静态资源
          - \`options/\` - 选项文件
          - \`LICENSE\` - 许可证
          - \`README.md\` - 说明文档

          ### 🔐 SHA256 校验和

          \`\`\`
          $(cat *.sha256)
          \`\`\`

          ### 🚀 快速开始

          1. 下载对应平台的压缩包
          2. 验证 SHA256 校验和
          3. 解压: \`tar xzf gitea-${VERSION}-{platform}.tar.gz\`
          4. 进入目录: \`cd gitea-${VERSION}-{platform}\`
          5. 启动: \`./start.sh\`

          ### 📖 详细文档

          更多信息请参考 [BUILD_GUIDE.md](../BUILD_GUIDE.md)

          ---

          **构建信息**
          - 版本号: ${VERSION}
          - 构建日期: $(date -u +"%Y-%m-%d %H:%M:%S UTC")
          - Go 版本: 1.23
          - 编译标签: sqlite sqlite_unlock_notify

          **技术特性**
          - 静态链接 (CGO_ENABLED=0)
          - 交叉编译支持
          - 完整资源内嵌

          EOF

          cd ..

          echo "✅ Release Notes 生成完成"
          cat release-notes.md

      - name: 创建 Git Tag
        run: |
          VERSION="${{ needs.generate-version.outputs.version }}"

          echo "🏷️ 创建 Git Tag: ${VERSION}"

          git config user.name "Gitea Actions"
          git config user.email "actions@gitea.local"

          # 检查 tag 是否已存在
          if git rev-parse "${VERSION}" >/dev/null 2>&1; then
            echo "⚠️ Tag ${VERSION} 已存在，跳过创建"
          else
            git tag -a "${VERSION}" -m "Release ${VERSION}"
            git push origin "${VERSION}"
            echo "✅ Tag ${VERSION} 创建成功"
          fi

      - name: 创建 Gitea Release
        env:
          GITEA_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.generate-version.outputs.version }}
        run: |
          echo "🚀 创建 Gitea Release: ${VERSION}"

          # 从仓库 URL 提取信息
          REPO_URL="${{ github.server_url }}/${{ github.repository }}"
          API_URL="${{ github.api_url }}/repos/${{ github.repository }}/releases"

          echo "API URL: ${API_URL}"

          # 读取 Release Notes
          RELEASE_BODY=$(cat release-notes.md)

          # 创建 Release
          curl -X POST "${API_URL}" \
            -H "Authorization: token ${GITEA_TOKEN}" \
            -H "Content-Type: application/json" \
            -d @- << EOF
          {
            "tag_name": "${VERSION}",
            "name": "Release ${VERSION}",
            "body": $(echo "${RELEASE_BODY}" | jq -Rs .),
            "draft": false,
            "prerelease": false
          }
          EOF

          echo "✅ Release 创建成功"

      - name: 上传 Release 产物
        env:
          GITEA_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.generate-version.outputs.version }}
        run: |
          echo "📤 上传 Release 产物..."

          API_URL="${{ github.api_url }}/repos/${{ github.repository }}/releases"

          # 获取 Release ID
          RELEASE_ID=$(curl -s "${API_URL}/tags/${VERSION}" \
            -H "Authorization: token ${GITEA_TOKEN}" \
            | jq -r '.id')

          echo "Release ID: ${RELEASE_ID}"

          # 上传所有产物
          cd release-files
          for file in *; do
            echo "📤 上传文件: ${file}"

            curl -X POST \
              "${API_URL}/${RELEASE_ID}/assets?name=${file}" \
              -H "Authorization: token ${GITEA_TOKEN}" \
              -H "Content-Type: application/octet-stream" \
              --data-binary "@${file}"

            echo "✅ ${file} 上传完成"
          done

          echo "🎉 所有产物上传完成！"

      - name: Release 摘要
        run: |
          echo "## 🎉 Release 发布完成" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**版本**: \`${{ needs.generate-version.outputs.version }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Release 链接**: ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ needs.generate-version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**包含产物**:" >> $GITHUB_STEP_SUMMARY
          echo "- gitea-${{ needs.generate-version.outputs.version }}-darwin-arm64.tar.gz" >> $GITHUB_STEP_SUMMARY
          echo "- gitea-${{ needs.generate-version.outputs.version }}-darwin-amd64.tar.gz" >> $GITHUB_STEP_SUMMARY
          echo "- gitea-${{ needs.generate-version.outputs.version }}-linux-arm64.tar.gz" >> $GITHUB_STEP_SUMMARY
          echo "- gitea-${{ needs.generate-version.outputs.version }}-linux-amd64.tar.gz" >> $GITHUB_STEP_SUMMARY
          echo "- 以及对应的 SHA256 校验文件" >> $GITHUB_STEP_SUMMARY

  # Job 6: 自动部署到生产服务器
  deploy:
    name: Deploy to Production
    needs: [generate-version, create-release]
    runs-on: ubuntu-latest
    # 仅在 main 分支且 Release 创建成功后部署
    if: github.ref == 'refs/heads/main'
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_PASSWORD: ${{ secrets.DEPLOY_PASSWORD }}
      GITEA_DATA_DIR: /data/gitea
      GITEA_BACKUP_DIR: /data/gitea-backups
      VERSION: ${{ needs.generate-version.outputs.version }}
    steps:
      - name: 检查部署配置
        run: |
          echo "🔍 检查部署配置..."

          if [ -z "${DEPLOY_HOST}" ] || [ -z "${DEPLOY_USER}" ] || [ -z "${DEPLOY_PASSWORD}" ]; then
            echo "⚠️ 部署配置不完整，跳过自动部署"
            echo "请在仓库 Secrets 中配置以下变量:"
            echo "  - DEPLOY_HOST: 生产服务器地址"
            echo "  - DEPLOY_USER: SSH 用户名"
            echo "  - DEPLOY_PASSWORD: SSH 密码"
            exit 0
          fi

          echo "✅ 部署配置检查通过"
          echo "   目标服务器: ${DEPLOY_HOST}"
          echo "   部署版本: ${VERSION}"

      - name: 安装 SSH 客户端
        run: |
          sudo apt-get update
          sudo apt-get install -y sshpass

      - name: 备份生产数据
        run: |
          echo "📦 开始备份生产服务器数据..."

          BACKUP_DATE=$(date +%Y%m%d_%H%M%S)
          BACKUP_NAME="gitea-backup-${BACKUP_DATE}"

          sshpass -p "${DEPLOY_PASSWORD}" ssh -o StrictHostKeyChecking=no ${DEPLOY_USER}@${DEPLOY_HOST} << ENDSSH
            set -e

            echo "🔍 检查 Gitea 服务状态..."

            # 创建备份目录
            mkdir -p ${GITEA_BACKUP_DIR}

            echo "📦 备份数据库..."
            if [ -f "${GITEA_DATA_DIR}/gitea.db" ]; then
              cp "${GITEA_DATA_DIR}/gitea.db" "${GITEA_BACKUP_DIR}/${BACKUP_NAME}-gitea.db"
              echo "✅ 数据库备份完成"
            fi

            echo "📦 备份配置文件..."
            if [ -d "${GITEA_DATA_DIR}/conf" ]; then
              tar czf "${GITEA_BACKUP_DIR}/${BACKUP_NAME}-conf.tar.gz" -C "${GITEA_DATA_DIR}" conf/
              echo "✅ 配置文件备份完成"
            fi

            echo "📦 备份自定义文件..."
            if [ -d "${GITEA_DATA_DIR}/custom" ]; then
              tar czf "${GITEA_BACKUP_DIR}/${BACKUP_NAME}-custom.tar.gz" -C "${GITEA_DATA_DIR}" custom/
              echo "✅ 自定义文件备份完成"
            fi

            echo "📦 备份仓库数据..."
            if [ -d "${GITEA_DATA_DIR}/gitea-repositories" ]; then
              tar czf "${GITEA_BACKUP_DIR}/${BACKUP_NAME}-repos.tar.gz" -C "${GITEA_DATA_DIR}" gitea-repositories/
              echo "✅ 仓库数据备份完成"
            fi

            # 清理超过 7 天的旧备份
            echo "🧹 清理旧备份文件..."
            find ${GITEA_BACKUP_DIR} -name "gitea-backup-*" -mtime +7 -delete 2>/dev/null || true

            echo "📋 当前备份列表:"
            ls -lh ${GITEA_BACKUP_DIR}/ | head -20

            echo "✅ 备份完成: ${BACKUP_NAME}"
          ENDSSH

          echo "✅ 生产服务器数据备份成功"

      - name: 从本地文件系统获取并部署新版本
        env:
          GITEA_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "🚀 开始部署新版本到生产服务器: ${VERSION}"

          # 确定目标平台（生产服务器是 linux-amd64）
          PLATFORM="linux-amd64"
          PACKAGE_NAME="gitea-${VERSION}-${PLATFORM}"
          API_URL="${{ github.api_url }}/repos/${{ github.repository }}/releases/tags/${VERSION}"

          echo "📡 从 API 获取 Release Asset UUID..."
          echo "API URL: ${API_URL}"

          # 获取 Release 信息
          RELEASE_INFO=$(curl -s -H "Authorization: token ${GITEA_TOKEN}" "${API_URL}")

          # 获取最新的 Asset UUID（同一个 Release 可能有多次构建产生的同名资源）
          ASSET_INFO=$(echo "${RELEASE_INFO}" | jq -r "[.assets[] | select(.name == \"${PACKAGE_NAME}.tar.gz\")] | sort_by(.id) | last")
          ASSET_UUID=$(echo "${ASSET_INFO}" | jq -r '.uuid')

          if [ -z "${ASSET_UUID}" ] || [ "${ASSET_UUID}" = "null" ]; then
            echo "❌ 无法获取 Asset UUID，Release 资源可能不存在"
            echo "正在查找的文件: ${PACKAGE_NAME}.tar.gz"
            echo "可用的 Assets:"
            echo "${RELEASE_INFO}" | jq '.assets[] | {id: .id, name: .name, uuid: .uuid}' 2>/dev/null || echo "${RELEASE_INFO}"
            exit 1
          fi

          echo "✅ 找到 Asset UUID: ${ASSET_UUID}"

          # Gitea 附件存储路径格式: /data/gitea/data/attachments/{uuid[0]}/{uuid[1]}/{uuid}
          # 使用 UUID 的前两个字符分别作为两层目录名
          # 例如 UUID "710244da-1268-4b9f-bd40-8b67c2814dae" 存储在:
          # /data/gitea/data/attachments/7/1/710244da-1268-4b9f-bd40-8b67c2814dae
          UUID_PREFIX_1=$(echo "${ASSET_UUID}" | cut -c1)
          UUID_PREFIX_2=$(echo "${ASSET_UUID}" | cut -c2)
          GITEA_DATA_DIR="/data/gitea/data"
          ATTACHMENT_PATH="${GITEA_DATA_DIR}/attachments/${UUID_PREFIX_1}/${UUID_PREFIX_2}/${ASSET_UUID}"

          echo "📁 Attachment 路径: ${ATTACHMENT_PATH}"

          # 由于 Gitea 服务器 (10.23.73.251) 就是部署目标服务器
          # 我们可以直接在服务器上从本地文件系统复制附件，无需通过 HTTP API 下载
          # 这样可以绕过 Gitea API token 无法下载 release assets 的已知限制
          # 参考: https://github.com/go-gitea/gitea/issues/26165

          sshpass -p "${DEPLOY_PASSWORD}" ssh -o StrictHostKeyChecking=no ${DEPLOY_USER}@${DEPLOY_HOST} << ENDSSH
            set -e

            echo "🔍 验证附件文件存在..."
            ATTACHMENT_PATH="${ATTACHMENT_PATH}"
            PACKAGE_NAME="${PACKAGE_NAME}"
            VERSION="${VERSION}"

            if [ ! -f "\${ATTACHMENT_PATH}" ]; then
              echo "❌ 附件文件不存在: \${ATTACHMENT_PATH}"
              echo "检查 attachments 目录结构:"
              ls -la ${GITEA_DATA_DIR}/attachments/ | head -20
              exit 1
            fi

            FILE_SIZE=\$(stat -c%s "\${ATTACHMENT_PATH}" 2>/dev/null || stat -f%z "\${ATTACHMENT_PATH}" 2>/dev/null || echo "0")
            echo "✅ 找到附件文件，大小: \${FILE_SIZE} bytes"

            if [ "\${FILE_SIZE}" -lt 30000000 ]; then
              echo "❌ 文件大小异常: \${FILE_SIZE} bytes (期望 > 30MB)"
              exit 1
            fi

            echo "📦 准备部署目录..."
            cd /tmp
            rm -rf gitea-deploy-\${VERSION}
            mkdir -p gitea-deploy-\${VERSION}
            cd gitea-deploy-\${VERSION}

            echo "📋 复制附件文件..."
            cp "\${ATTACHMENT_PATH}" ./\${PACKAGE_NAME}.tar.gz

            echo "📦 解压发布包..."
            tar xzf \${PACKAGE_NAME}.tar.gz

            echo "🛑 停止 Gitea 服务..."
            systemctl stop gitea 2>/dev/null || service gitea stop 2>/dev/null || true

            # 等待服务完全停止
            sleep 5

            echo "📋 备份当前二进制..."
            if [ -f "/usr/local/bin/gitea" ]; then
              cp /usr/local/bin/gitea /usr/local/bin/gitea.bak
            fi

            echo "📦 部署新版本..."
            cp \${PACKAGE_NAME}/gitea /usr/local/bin/gitea
            chmod +x /usr/local/bin/gitea

            echo "🔍 验证新版本..."
            /usr/local/bin/gitea --version

            echo "🚀 启动 Gitea 服务..."
            systemctl start gitea 2>/dev/null || service gitea start 2>/dev/null || true

            # 等待服务启动
            sleep 10

            echo "🔍 检查服务状态..."
            systemctl status gitea --no-pager 2>/dev/null || service gitea status 2>/dev/null || true

            # 清理临时文件
            echo "🧹 清理临时文件..."
            cd /tmp
            rm -rf gitea-deploy-\${VERSION}

            echo "✅ 部署完成: \${VERSION}"
          ENDSSH

          echo "✅ 新版本部署成功"

      - name: 验证部署
        run: |
          echo "🔍 验证部署结果..."

          sleep 5

          sshpass -p "${DEPLOY_PASSWORD}" ssh -o StrictHostKeyChecking=no ${DEPLOY_USER}@${DEPLOY_HOST} << ENDSSH
            echo "📋 Gitea 版本信息:"
            /usr/local/bin/gitea --version

            echo ""
            echo "📋 服务状态:"
            systemctl status gitea --no-pager 2>/dev/null || service gitea status 2>/dev/null || echo "服务状态检查需要手动确认"

            echo ""
            echo "📋 进程信息:"
            ps aux | grep gitea | grep -v grep || true

            echo ""
            echo "📋 端口监听:"
            netstat -tlnp 2>/dev/null | grep gitea || ss -tlnp 2>/dev/null | grep gitea || true
          ENDSSH

          echo "✅ 部署验证完成"

      - name: 部署摘要
        run: |
          echo "## 🚀 自动部署完成" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**版本**: \`${VERSION}\`" >> $GITHUB_STEP_SUMMARY
          echo "**目标服务器**: \`${DEPLOY_HOST}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 部署步骤" >> $GITHUB_STEP_SUMMARY
          echo "1. ✅ 检查部署配置" >> $GITHUB_STEP_SUMMARY
          echo "2. ✅ 备份生产数据（数据库、配置、仓库）" >> $GITHUB_STEP_SUMMARY
          echo "3. ✅ 下载新版本发布包" >> $GITHUB_STEP_SUMMARY
          echo "4. ✅ 停止服务并更新二进制" >> $GITHUB_STEP_SUMMARY
          echo "5. ✅ 启动服务并验证" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 备份位置" >> $GITHUB_STEP_SUMMARY
          echo "\`${GITEA_BACKUP_DIR}/\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "⚠️ **注意**: 如需回滚，备份文件保留 7 天" >> $GITHUB_STEP_SUMMARY
