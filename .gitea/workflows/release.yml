name: Release Build

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      version_override:
        description: '覆盖版本号（可选，格式：v1.25.2.1125-Kysion）'
        required: false
        type: string

jobs:
  # Job 1: 生成版本号
  generate-version:
    name: Generate Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 生成版本号
        id: version
        run: |
          if [ -n "${{ inputs.version_override }}" ]; then
            # 使用手动指定的版本号
            VERSION="${{ inputs.version_override }}"
          else
            # 从 VERSION 文件读取基础版本
            BASE_VERSION=$(cat VERSION | tr -d '\n')
            # 生成日期（MMDD格式）
            DATE=$(date +%m%d)
            # 组合完整版本号
            VERSION="v${BASE_VERSION}.${DATE}-Kysion"
          fi

          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "✅ 生成版本号: ${VERSION}"

      - name: 显示版本信息
        run: |
          echo "📦 准备构建版本: ${{ steps.version.outputs.version }}"

  # Job 2: 构建前端（只构建一次）
  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Node.js 环境
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 安装 pnpm
        run: npm install -g pnpm

      - name: 显示环境信息
        run: |
          echo "📦 Node版本: $(node --version)"
          echo "📦 pnpm版本: $(pnpm --version)"

      - name: 安装前端依赖
        run: |
          echo "📦 安装前端依赖..."
          pnpm install --frozen-lockfile

      - name: 编译前端
        run: |
          echo "🔨 编译前端资源..."
          NODE_ENV=production pnpm build

      - name: 上传前端构建产物
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: |
            public/assets/
          retention-days: 1

  # Job 3: 构建后端（多平台 matrix）
  build-backend:
    name: Build Backend (${{ matrix.os }}-${{ matrix.arch }})
    needs: [generate-version, build-frontend]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - os: darwin
            arch: arm64
          - os: darwin
            arch: amd64
          - os: linux
            arch: arm64
          - os: linux
            arch: amd64

    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 设置 Go 环境
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: 显示环境信息
        run: |
          echo "🔨 Go版本: $(go version)"
          echo "🎯 目标平台: ${{ matrix.os }}-${{ matrix.arch }}"
          echo "📦 版本号: ${{ needs.generate-version.outputs.version }}"

      - name: 下载前端构建产物
        uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: public/assets/

      - name: 编译后端 (${{ matrix.os }}-${{ matrix.arch }})
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: 0
          VERSION: ${{ needs.generate-version.outputs.version }}
          TAGS: "sqlite sqlite_unlock_notify"
        run: |
          echo "🔨 编译后端 (${{ matrix.os }}-${{ matrix.arch }})..."
          go build \
            -tags "${TAGS}" \
            -ldflags "-s -w -X 'main.Version=${VERSION}' -X 'main.Tags=${TAGS}'" \
            -o gitea-${{ matrix.os }}-${{ matrix.arch }} \
            code.gitea.io/gitea

          echo "✅ 编译完成"
          ls -lh gitea-${{ matrix.os }}-${{ matrix.arch }}

      - name: 验证版本信息
        run: |
          echo "🔍 验证版本信息..."

          # 通过字符串搜索来验证版本号是否注入
          if strings gitea-${{ matrix.os }}-${{ matrix.arch }} | grep -q "${{ needs.generate-version.outputs.version }}"; then
            echo "✅ 版本号注入成功: ${{ needs.generate-version.outputs.version }}"
          else
            echo "❌ 版本号注入失败"
            exit 1
          fi

      - name: 创建发布包
        run: |
          echo "📦 创建发布包..."

          VERSION="${{ needs.generate-version.outputs.version }}"
          PLATFORM="${{ matrix.os }}-${{ matrix.arch }}"
          PACKAGE_NAME="gitea-${VERSION}-${PLATFORM}"
          PACKAGE_DIR="${PACKAGE_NAME}"

          # 创建打包目录
          mkdir -p "${PACKAGE_DIR}"

          # 复制二进制文件
          cp gitea-${{ matrix.os }}-${{ matrix.arch }} "${PACKAGE_DIR}/gitea"
          chmod +x "${PACKAGE_DIR}/gitea"

          # 复制资源文件
          if [ -d "custom" ]; then
            cp -r custom "${PACKAGE_DIR}/"
          fi

          if [ -d "templates" ]; then
            cp -r templates "${PACKAGE_DIR}/"
          fi

          if [ -d "public" ]; then
            cp -r public "${PACKAGE_DIR}/"
          fi

          if [ -d "options" ]; then
            cp -r options "${PACKAGE_DIR}/"
          fi

          # 复制文档
          if [ -f "LICENSE" ]; then
            cp LICENSE "${PACKAGE_DIR}/"
          fi

          if [ -f "README.md" ]; then
            cp README.md "${PACKAGE_DIR}/"
          fi

          # 创建启动脚本
          cat > "${PACKAGE_DIR}/start.sh" << 'EOF'
#!/bin/bash
# Gitea 启动脚本

set -e

GITEA_WORK_DIR="${GITEA_WORK_DIR:-$(pwd)}"
GITEA_CUSTOM="${GITEA_CUSTOM:-${GITEA_WORK_DIR}/custom}"

export GITEA_WORK_DIR
export GITEA_CUSTOM

echo "🚀 启动 Gitea..."
echo "工作目录: ${GITEA_WORK_DIR}"
echo "自定义目录: ${GITEA_CUSTOM}"

exec ./gitea web
EOF

          chmod +x "${PACKAGE_DIR}/start.sh"

          # 创建 tar.gz 压缩包
          tar czf "${PACKAGE_NAME}.tar.gz" "${PACKAGE_DIR}"

          # 生成 SHA256 校验文件
          sha256sum "${PACKAGE_NAME}.tar.gz" > "${PACKAGE_NAME}.tar.gz.sha256"

          echo "✅ 发布包创建完成"
          ls -lh "${PACKAGE_NAME}.tar.gz"
          cat "${PACKAGE_NAME}.tar.gz.sha256"

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: gitea-${{ needs.generate-version.outputs.version }}-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            gitea-${{ needs.generate-version.outputs.version }}-${{ matrix.os }}-${{ matrix.arch }}.tar.gz
            gitea-${{ needs.generate-version.outputs.version }}-${{ matrix.os }}-${{ matrix.arch }}.tar.gz.sha256
          retention-days: 30

  # Job 4: 构建摘要
  build-summary:
    name: Build Summary
    needs: [generate-version, build-backend]
    runs-on: ubuntu-latest
    steps:
      - name: 构建摘要
        run: |
          echo "## 🎉 多平台构建完成" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**版本号**: \`${{ needs.generate-version.outputs.version }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**支持平台**:" >> $GITHUB_STEP_SUMMARY
          echo "- 🍎 macOS ARM64 (darwin-arm64)" >> $GITHUB_STEP_SUMMARY
          echo "- 🍎 macOS x86_64 (darwin-amd64)" >> $GITHUB_STEP_SUMMARY
          echo "- 🐧 Linux ARM64 (linux-arm64)" >> $GITHUB_STEP_SUMMARY
          echo "- 🐧 Linux x86_64 (linux-amd64)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**产物列表**:" >> $GITHUB_STEP_SUMMARY
          echo "- \`gitea-${{ needs.generate-version.outputs.version }}-darwin-arm64.tar.gz\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`gitea-${{ needs.generate-version.outputs.version }}-darwin-amd64.tar.gz\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`gitea-${{ needs.generate-version.outputs.version }}-linux-arm64.tar.gz\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`gitea-${{ needs.generate-version.outputs.version }}-linux-amd64.tar.gz\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "💡 所有产物包含 SHA256 校验文件" >> $GITHUB_STEP_SUMMARY

  # Job 5: 创建 Release
  create-release:
    name: Create Release
    needs: [generate-version, build-backend]
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 下载所有构建产物
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: 整理产物文件
        run: |
          echo "📦 整理产物文件..."
          mkdir -p release-files

          # 将所有产物移动到 release-files 目录
          find artifacts/ -name "*.tar.gz" -exec mv {} release-files/ \;
          find artifacts/ -name "*.sha256" -exec mv {} release-files/ \;

          echo "✅ 产物文件列表:"
          ls -lh release-files/

      - name: 生成 Release Notes
        id: release-notes
        run: |
          VERSION="${{ needs.generate-version.outputs.version }}"

          # 读取 SHA256 校验和
          cd release-files

          cat > ../release-notes.md << EOF
          ## 🎉 Kysion Gitea ${VERSION}

          基于 Gitea v1.25.2 的定制版本，包含 Kysion 特定优化和功能。

          ### 📦 支持平台

          - 🍎 **macOS ARM64** (darwin-arm64) - Apple Silicon (M1/M2/M3)
          - 🍎 **macOS x86_64** (darwin-amd64) - Intel Mac
          - 🐧 **Linux ARM64** (linux-arm64) - ARM64 服务器
          - 🐧 **Linux x86_64** (linux-amd64) - x86_64 服务器

          ### 📥 下载说明

          请根据您的平台选择相应的压缩包下载。每个压缩包包含：
          - \`gitea\` - 可执行文件
          - \`start.sh\` - 启动脚本
          - \`custom/\` - 自定义配置
          - \`templates/\` - 模板文件
          - \`public/\` - 静态资源
          - \`options/\` - 选项文件
          - \`LICENSE\` - 许可证
          - \`README.md\` - 说明文档

          ### 🔐 SHA256 校验和

          \`\`\`
          $(cat *.sha256)
          \`\`\`

          ### 🚀 快速开始

          1. 下载对应平台的压缩包
          2. 验证 SHA256 校验和
          3. 解压: \`tar xzf gitea-${VERSION}-{platform}.tar.gz\`
          4. 进入目录: \`cd gitea-${VERSION}-{platform}\`
          5. 启动: \`./start.sh\`

          ### 📖 详细文档

          更多信息请参考 [BUILD_GUIDE.md](../BUILD_GUIDE.md)

          ---

          **构建信息**
          - 版本号: ${VERSION}
          - 构建日期: $(date -u +"%Y-%m-%d %H:%M:%S UTC")
          - Go 版本: 1.23
          - 编译标签: sqlite sqlite_unlock_notify

          **技术特性**
          - 静态链接 (CGO_ENABLED=0)
          - 交叉编译支持
          - 完整资源内嵌

          EOF

          cd ..

          echo "✅ Release Notes 生成完成"
          cat release-notes.md

      - name: 创建 Git Tag
        run: |
          VERSION="${{ needs.generate-version.outputs.version }}"

          echo "🏷️ 创建 Git Tag: ${VERSION}"

          git config user.name "Gitea Actions"
          git config user.email "actions@gitea.local"

          # 检查 tag 是否已存在
          if git rev-parse "${VERSION}" >/dev/null 2>&1; then
            echo "⚠️ Tag ${VERSION} 已存在，跳过创建"
          else
            git tag -a "${VERSION}" -m "Release ${VERSION}"
            git push origin "${VERSION}"
            echo "✅ Tag ${VERSION} 创建成功"
          fi

      - name: 创建 Gitea Release
        env:
          GITEA_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.generate-version.outputs.version }}
        run: |
          echo "🚀 创建 Gitea Release: ${VERSION}"

          # 从仓库 URL 提取信息
          REPO_URL="${{ github.server_url }}/${{ github.repository }}"
          API_URL="${{ github.api_url }}/repos/${{ github.repository }}/releases"

          echo "API URL: ${API_URL}"

          # 读取 Release Notes
          RELEASE_BODY=$(cat release-notes.md)

          # 创建 Release
          curl -X POST "${API_URL}" \
            -H "Authorization: token ${GITEA_TOKEN}" \
            -H "Content-Type: application/json" \
            -d @- << EOF
          {
            "tag_name": "${VERSION}",
            "name": "Release ${VERSION}",
            "body": $(echo "${RELEASE_BODY}" | jq -Rs .),
            "draft": false,
            "prerelease": false
          }
          EOF

          echo "✅ Release 创建成功"

      - name: 上传 Release 产物
        env:
          GITEA_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.generate-version.outputs.version }}
        run: |
          echo "📤 上传 Release 产物..."

          API_URL="${{ github.api_url }}/repos/${{ github.repository }}/releases"

          # 获取 Release ID
          RELEASE_ID=$(curl -s "${API_URL}/tags/${VERSION}" \
            -H "Authorization: token ${GITEA_TOKEN}" \
            | jq -r '.id')

          echo "Release ID: ${RELEASE_ID}"

          # 上传所有产物
          cd release-files
          for file in *; do
            echo "📤 上传文件: ${file}"

            curl -X POST \
              "${API_URL}/${RELEASE_ID}/assets?name=${file}" \
              -H "Authorization: token ${GITEA_TOKEN}" \
              -H "Content-Type: application/octet-stream" \
              --data-binary "@${file}"

            echo "✅ ${file} 上传完成"
          done

          echo "🎉 所有产物上传完成！"

      - name: Release 摘要
        run: |
          echo "## 🎉 Release 发布完成" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**版本**: \`${{ needs.generate-version.outputs.version }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Release 链接**: ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ needs.generate-version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**包含产物**:" >> $GITHUB_STEP_SUMMARY
          echo "- gitea-${{ needs.generate-version.outputs.version }}-darwin-arm64.tar.gz" >> $GITHUB_STEP_SUMMARY
          echo "- gitea-${{ needs.generate-version.outputs.version }}-darwin-amd64.tar.gz" >> $GITHUB_STEP_SUMMARY
          echo "- gitea-${{ needs.generate-version.outputs.version }}-linux-arm64.tar.gz" >> $GITHUB_STEP_SUMMARY
          echo "- gitea-${{ needs.generate-version.outputs.version }}-linux-amd64.tar.gz" >> $GITHUB_STEP_SUMMARY
          echo "- 以及对应的 SHA256 校验文件" >> $GITHUB_STEP_SUMMARY
