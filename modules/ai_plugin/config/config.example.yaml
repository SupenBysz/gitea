# AI Collaboration Plugin Configuration Example
# Copy this file to config.yaml and modify as needed

server:
  host: "0.0.0.0"
  port: 8081
  read_timeout: 30s
  write_timeout: 30s
  idle_timeout: 60s

database:
  driver: postgres
  host: localhost
  port: 5432
  user: ai_plugin
  password: your_password_here
  database: ai_plugin
  ssl_mode: disable
  max_open_conns: 25
  max_idle_conns: 5
  conn_max_lifetime: 5m
  auto_migrate: true

redis:
  host: localhost
  port: 6379
  password: ""
  db: 0
  pool_size: 10

gitea:
  base_url: "https://gitea.example.com"
  api_token: "your_gitea_api_token"
  client_id: ""
  client_secret: ""

webhook:
  secret: "your_webhook_secret"
  validate_signature: true
  queue_size: 1000
  workers: 5
  timeout: 30s

notification:
  telegram:
    enabled: true
    bot_token: "your_telegram_bot_token"
    default_chat_id: 0  # Your Telegram chat ID

  email:
    enabled: false
    smtp_host: smtp.example.com
    smtp_port: 587
    username: ""
    password: ""
    from: "ai-plugin@example.com"
    tls: true

  slack:
    enabled: false
    webhook_url: ""
    bot_token: ""
    default_channel: "#ai-notifications"

  webhook:
    enabled: false
    url: ""
    secret: ""

rule_engine:
  rules_path: "./rules"
  reload_interval: 5m
  enabled_by_default: true
  max_conditions: 20
  max_actions: 10
  eval_timeout: 10s

llm:
  enabled: false
  default_provider: "anthropic"
  request_timeout: 60s
  max_retries: 3
  retry_delay: 1s

security:
  jwt_secret: "your_jwt_secret_here"
  jwt_expiration: 24h
  api_key_header: "X-API-Key"
  rate_limit_enabled: true
  rate_limit_per_min: 100
  cors_origins:
    - "*"

logging:
  level: info  # debug, info, warn, error
  format: json  # json, text
  output: stdout  # stdout, file
  file: ""  # path to log file if output is file
